name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - src/safaribookmarks/version.py

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - id: version
        run: |
          version=$(sed -n -E '/VERSION/s/[^=]+=\s*//p' src/safaribookmarks/version.py | sed -E 's/(^[^"]*"|"[^"]*$)//g')
          tag="v${version}"
          echo "new_version=${version}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.new_tag }}
          TARGET_COMMIT: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/** --draft --generate-notes --target "$TARGET_COMMIT"
